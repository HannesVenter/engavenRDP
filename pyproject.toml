[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engavenrdp"
version = "0.1.0"
description = "RDP connection manager for Linux — manage and embed many RDP sessions (FreeRDP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.5",
    "cryptography>=41",
    "python-xlib>=0.33",
]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
dev = ["pytest>=7"]

[project.scripts]
engavenrdp = "engavenrdp.cli:main"

[tool.setuptools.packages.find]
include = ["engavenrdp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
